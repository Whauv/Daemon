<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daemon | Page not found</title>
  <link rel="icon" href="/favicon.ico" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: var(--space-6);
      background: radial-gradient(circle at 20% 18%, var(--bg-glow) 0%, var(--bg-0) 50%);
      color: var(--text);
      font-family: var(--font-sans);
    }

    main {
      width: min(100%, 40rem);
      padding: var(--space-10) var(--space-8);
      border-radius: var(--radius-l);
      background: linear-gradient(180deg, var(--bg-2), var(--bg-1));
      border: 1px solid var(--line);
    }

    .eyebrow {
      margin: 0 0 var(--space-4);
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      letter-spacing: 0.26em;
      color: var(--accent);
    }

    h1 {
      margin: 0 0 var(--space-4);
      font-size: clamp(2rem, 5vw, 3.25rem);
      line-height: 1.05;
    }

    p { margin: 0; color: var(--text-muted); line-height: 1.7; }

    code {
      font-family: var(--font-mono);
      font-size: var(--text-sm);
      color: var(--text);
    }

    nav {
      display: flex;
      gap: var(--space-3);
      flex-wrap: wrap;
      margin-top: var(--space-8);
    }

    a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 0 var(--space-5);
      border-radius: var(--radius-m);
      border: 1px solid var(--line-strong);
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
    }

    a:hover { background: var(--bg-3); }
    a:focus-visible { outline: none; box-shadow: var(--focus-ring); }

    a.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">DAEMON · 404</p>
    <h1>Page not found</h1>
    <p>The route you requested is not available. Head back to the landing page, or open the dashboard to keep working on your runs.</p>
    <nav aria-label="Recovery links">
      <a class="primary" href="/dashboard">Open dashboard</a>
      <a href="/">Go to landing page</a>
    </nav>
  </main>
</body>
</html>
