name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Pin ruff: new releases can enable extra default rules and fail CI with no code change.
          pip install pytest ruff==0.17.5

      - name: Ruff
        run: ruff check main.py src tests

      - name: Pytest
        env:
          PYTHONPATH: src
        run: pytest -q

  javascript:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        # ESLint is pinned in package.json: new releases can enable extra default
        # rules and fail CI with no code change (same reason ruff is pinned above).
        run: npm install --no-audit --no-fund

      - name: ESLint
        run: npm run lint

      - name: Node tests
        run: npm test
